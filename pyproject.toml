[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "famnsdk"
version = "1.0.6"
description = "Async Python client for the Famn family organizer API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.9.0"]
authors = [{ name = "Daniel Rufus Kaldheim", email = "daniel@kaldheim.org" }]
keywords = ["famn", "api-client", "asyncio", "aiohttp", "home-assistant"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/crudusapps/famn-python-sdk"
Source = "https://github.com/crudusapps/famn-python-sdk"
Issues = "https://github.com/crudusapps/famn-python-sdk/issues"
Changelog = "https://github.com/crudusapps/famn-python-sdk/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
