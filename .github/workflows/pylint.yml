name: Pylint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and Pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install pylint

      - name: Run Pylint
        run: |
          python -m pylint --py-version=3.11 --errors-only \
            $(git ls-files '*.py')
